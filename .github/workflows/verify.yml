name: Verify bot

on:
  push:
    paths-ignore:
      - 'state.json'
      - 'telegram-queue.json'
      - 'email-queue.json'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check live CISIA calendar without sending notifications
        run: node check-tolc.js --dry-run
