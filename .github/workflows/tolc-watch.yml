name: TOLC Watch

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        type: boolean
        description: 'Send a real priority-2 (emergency) alert with the current extracted text'
        default: false
      test_notification:
        type: boolean
        description: 'Send a test notification instead of checking the website (default: off)'
        default: false
      test_email:
        type: boolean
        description: 'Send a test email via Gmail SMTP instead of checking the website (default: off)'
        default: false

permissions:
  contents: write

concurrency:
  group: tolc-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TOLC watch
        id: watch
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_NOTIFICATIONS_ENABLED: ${{ secrets.TELEGRAM_NOTIFICATIONS_ENABLED }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
        run: |
          if [ "${{ github.event.inputs.force_alert }}" = "true" ]; then
            node check-tolc.js --force-alert
          elif [ "${{ github.event.inputs.test_email }}" = "true" ]; then
            node check-tolc.js --send-test-email
          elif [ "${{ github.event.inputs.test_notification }}" = "true" ]; then
            node check-tolc.js --send-test
          else
            node check-tolc.js
          fi

      - name: Commit watcher state if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if [ -f telegram-queue.json ]; then git add telegram-queue.json; fi
          if [ -f email-queue.json ]; then git add email-queue.json; fi
          if git diff --cached --quiet; then
            echo "No state changes; nothing to commit"
          else
            git commit -m "chore: update tolc-watch state"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
