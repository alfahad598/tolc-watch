name: TOLC Watch

on:
  schedule:
    - cron: '*/1 * * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        type: boolean
        description: 'Send a real priority-2 (emergency) alert with the current extracted text'
        default: false
      test_notification:
        type: boolean
        description: 'Send a Telegram test notification to verify integration'
        default: false

permissions:
  contents: write

concurrency:
  group: tolc-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TOLC watch
        id: watch
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_NOTIFICATIONS_ENABLED: ${{ secrets.TELEGRAM_NOTIFICATIONS_ENABLED }}
        run: |
          if [ "${{ github.event.inputs.force_alert }}" = "true" ]; then
            node check-tolc.js --force-alert
          elif [ "${{ github.event.inputs.test_notification }}" = "true" ]; then
            node check-tolc.js --send-test
          else
            node check-tolc.js --status-alert
          fi

      - name: Commit state.json if changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --cached --quiet -- state.json; then
            echo "state.json unchanged; nothing to commit"
          else
            git commit -m "chore: update tolc-watch state"
            git push
          fi
