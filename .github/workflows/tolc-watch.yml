name: TOLC Watch

on:
  schedule:
    # GitHub delays or drops scheduled runs heavily (gaps of 4-7 hours were
    # observed with */5), so each run loops for ~5h45m checking every 2 minutes.
    # These triggers only restart the loop; a trigger that fires while a loop is
    # running waits in the queue and starts as soon as the loop ends.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        type: boolean
        description: 'Send a real priority-2 (emergency) alert listing the current sessions'
        default: false
      test_notification:
        type: boolean
        description: 'Send a test notification instead of checking the website (default: off)'
        default: false
      test_email:
        type: boolean
        description: 'Send a test email via Gmail SMTP instead of checking the website (default: off)'
        default: false

permissions:
  contents: write

concurrency:
  group: tolc-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run TOLC watch
        env:
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_IDS: ${{ secrets.TELEGRAM_ALLOWED_CHAT_IDS }}
          TELEGRAM_NOTIFICATIONS_ENABLED: ${{ secrets.TELEGRAM_NOTIFICATIONS_ENABLED }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_RECIPIENTS: ${{ secrets.EMAIL_RECIPIENTS }}
          FORCE_ALERT: ${{ github.event.inputs.force_alert }}
          TEST_EMAIL: ${{ github.event.inputs.test_email }}
          TEST_NOTIFICATION: ${{ github.event.inputs.test_notification }}
          LOOP_MINUTES: '345'
          INTERVAL_SECONDS: '120'
        run: |
          commit_state() {
            git add state.json
            if [ -f telegram-queue.json ]; then git add telegram-queue.json; fi
            if [ -f email-queue.json ]; then git add email-queue.json; fi
            if ! git diff --cached --quiet; then
              git commit -q -m "chore: update tolc-watch state"
            fi
            # Nothing new locally (including no earlier unpushed commit): done.
            if [ -z "$(git log "origin/$GITHUB_REF_NAME..HEAD" --oneline)" ]; then return 0; fi
            for attempt in 1 2 3; do
              # During a rebase "theirs" is our local commit, so our fresh state wins.
              if git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME" && git push -q; then
                return 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            echo "::warning::Could not push state; will retry after the next check"
          }

          if [ "$FORCE_ALERT" = "true" ]; then
            node check-tolc.js --force-alert
          elif [ "$TEST_EMAIL" = "true" ]; then
            node check-tolc.js --send-test-email
          elif [ "$TEST_NOTIFICATION" = "true" ]; then
            node check-tolc.js --send-test
          else
            end=$((SECONDS + LOOP_MINUTES * 60))
            while :; do
              node check-tolc.js || echo "::warning::Check failed (tracked in state.json failCount)"
              commit_state
              if [ "$SECONDS" -ge "$end" ]; then break; fi
              sleep "$INTERVAL_SECONDS"
            done
          fi

      - name: Commit watcher state if changed
        if: always()
        run: |
          git add state.json
          if [ -f telegram-queue.json ]; then git add telegram-queue.json; fi
          if [ -f email-queue.json ]; then git add email-queue.json; fi
          if git diff --cached --quiet; then
            echo "No state changes; nothing to commit"
          else
            git commit -m "chore: update tolc-watch state"
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push
          fi
